name: lyrid-nfl-builds
# All NFL data builds run through ONE script, data/nfl/refresh_all.py, which owns the order and the
# arguments. Local and automated runs are identical: `python3 data/nfl/refresh_all.py`.
#   recency (Thu/Sun/Mon)  injuries, QB form, defense form/pace, defense-vs-position — fresh before each slate
#   season  (Tuesday)      player games -> env -> feature vectors -> defense/team tiers, after games are final
# Run by hand anytime: GitHub -> Actions -> lyrid-nfl-builds -> Run workflow (pick both / recency / season).
on:
  schedule:
    - cron: '0 12 * * 4'   # Thu ~7-8am ET  — recency, before Thursday Night Football
    - cron: '0 12 * * 0'   # Sun ~7-8am ET  — recency, before the Sunday slate
    - cron: '0 19 * * 1'   # Mon ~2-3pm ET  — recency, before Monday Night Football
    - cron: '0 14 * * 2'   # Tue ~9-10am ET — season, after the week's games are final
  workflow_dispatch:
    inputs:
      job:
        description: 'which builds to run'
        required: false
        default: 'both'
        type: choice
        options: [both, recency, season]

concurrency:
  group: lyrid-nfl-builds
  cancel-in-progress: false

jobs:
  recency:
    if: (github.event_name == 'schedule' && github.event.schedule != '0 14 * * 2') || (github.event_name == 'workflow_dispatch' && inputs.job != 'season')
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet pandas numpy requests pyarrow
      - name: Recency builds
        run: python3 data/nfl/refresh_all.py --only recency

  season:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 14 * * 2') || (github.event_name == 'workflow_dispatch' && inputs.job != 'recency')
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet pandas numpy requests pyarrow
      - name: Season builds (player games -> env -> feature vectors -> tiers)
        run: python3 data/nfl/refresh_all.py --only season
