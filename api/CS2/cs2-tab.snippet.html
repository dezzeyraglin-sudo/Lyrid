  #cs2-panel .cs2-low{color:var(--data-warning)}

  #cs2-panel .cs2-line-row{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-2);padding-top:var(--space-2);border-top:0.5px solid var(--border-hairline);flex-wrap:wrap}
  #cs2-panel .cs2-line-label{font-size:var(--size-eyebrow);letter-spacing:var(--tracking-loose);text-transform:uppercase;color:var(--text-secondary)}
  #cs2-panel .cs2-line-input{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:var(--size-mono-sm);width:64px;height:28px;padding:0 8px;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-card);color:var(--text-primary)}
  #cs2-panel .cs2-line-input:focus{outline:none;border-color:var(--brand-primary);box-shadow:var(--elevation-focus)}
  #cs2-panel .cs2-line-res{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:var(--size-mono-sm);color:var(--text-primary)}

</style>
<script>
(function () {
  const state = { raw: null, selectedMatchId: null, loaded: false, lines: {}, lineKeys: {}, lineP: {} };
  try { state.lines = JSON.parse(localStorage.getItem('lyrid_cs2_lines') || '{}') || {}; } catch (_) { state.lines = {}; }
  window._cs2State = state;

  const cs2TodayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  state.date = cs2TodayStr();
  function setCs2DateDisplay() {
    const el = document.getElementById('cs2DateDisplay'); if (!el) return;
    el.textContent = state.date === cs2TodayStr() ? 'Today' : new Date(state.date + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' });
  }
  window.cs2ChangeDate = function (delta) {
    if (delta === 'today') state.date = cs2TodayStr();
    else { const d = new Date(state.date + 'T12:00:00'); d.setDate(d.getDate() + delta); state.date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    loadCs2Slate();
  };

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const bandClass = (b) => b === 'STRONG' ? 'glb-tier-strong' : b === 'LEAN' ? 'glb-tier-moderate' : 'cs2-band-pass';
  const leanClass = (l) => l === 'OVER-friendly' ? 'cs2-lean-over' : l === 'UNDER-friendly' ? 'cs2-lean-under' : 'cs2-lean-neutral';
  const fmtTime = (iso) => { if (!iso) return null; const d = new Date(iso); if (isNaN(d)) return null; if (d.getUTCHours() === 0 && d.getUTCMinutes() === 0) return null; return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
  const erf = (x) => { const t = 1 / (1 + 0.3275911 * Math.abs(x)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; };
  const ncdf = (z) => 0.5 * (1 + erf(z / Math.SQRT2));

  window.switchToCs2 = function () {
    if (typeof switchTab === 'function') switchTab('cs2');
    else {
      document.querySelectorAll('.lyrid-nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.lyrid-nav-btn[data-tab="cs2"]')?.classList.add('active');
      document.querySelectorAll('.panel-content').forEach(p => p.classList.remove('active'));
      document.getElementById('cs2-panel')?.classList.add('active');
    }
    if (!state.loaded) loadCs2Slate();
  };

  window.loadCs2Slate = async function () {
    const list = document.getElementById('cs2GamesList');
    const analysis = document.getElementById('cs2AnalysisContainer');
    const meta = document.getElementById('cs2Meta');
    if (list) list.innerHTML = `<div class="lyrid-empty"><div class="lyrid-empty-text">Loading slate…</div></div>`;
    if (analysis) analysis.innerHTML = '';
    state.loaded = true;
    setCs2DateDisplay();

    // 1) projections snapshot (generated offline by matchRead --today, deployed static)
    let proj = null;
    for (const url of ['/api/cs2/slate', '/cs2_reads.json']) {
      try { const res = await fetch(url, { cache: 'no-store' }); if (res.ok) { proj = await res.json(); break; } }
      catch (_) { /* try next */ }
    }
    const projMap = {};
    if (proj && Array.isArray(proj.matches)) for (const m of proj.matches) projMap[String(m.matchId)] = m;

    // 2) live fixtures for the selected date (GOAT-gated; falls back gracefully)
    let sched = null;
    try {
      const r = await fetch('/api/cs2/schedule?date=' + encodeURIComponent(state.date), { cache: 'no-store' });
      if (r.ok) sched = await r.json();
    } catch (_) { /* no live schedule available */ }

    let matches = null;
    if (sched && Array.isArray(sched.games)) {
      // merge: each live fixture keeps its projection if one is deployed, else pending
      matches = sched.games.map(g => projMap[String(g.matchId)] || ({
        matchId: g.matchId, teamA: g.teamA, teamB: g.teamB, startTime: g.startTime,
        tier: g.tier, lan: g.lan, stage: g.stage, doOrDie: g.doOrDie,
        format: g.bestOf ? 'Bo' + g.bestOf : null, pending: true,
      }));
    } else if (proj && Array.isArray(proj.matches)) {
      // no live schedule (ALL-STAR / function not deployed) — show the static snapshot
      matches = proj.matches;
    }

    if (!matches) {
      if (list) list.innerHTML = `
        <div class="lyrid-empty">
          <div class="lyrid-empty-title">No CS2 games for ${esc(state.date)}</div>
          <div class="lyrid-empty-text">Live fixtures come from <code>/api/cs2/schedule</code> (needs GOAT). Projections come from <code>matchRead --today</code> → <code>cs2_reads.json</code>. Neither returned games for this date.</div>
        </div>`;
      if (meta) meta.textContent = '';
      return;
    }
    const projected = matches.filter(m => !m.pending).length;
    state.raw = { ...(proj || {}), matches, _projected: projected, _total: matches.length };
    renderCs2Slate();
  };

  function renderCs2Slate() {
    const data = state.raw;
    const list = document.getElementById('cs2GamesList');
    const banner = document.getElementById('cs2Banner');
    const meta = document.getElementById('cs2Meta');
    if (!data || !list) return;

    if (meta) {
      const gen = data.generatedAt ? new Date(data.generatedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
      const players = (data.matches || []).reduce((a, m) => a + (m.players ? m.players.length : 0), 0);
      meta.textContent = `${(data.matches || []).length} MATCHES · ${players} PLAYERS${gen ? ' · ' + gen : ''}`;
    }

    if (banner) {
      banner.innerHTML = `
        <div class="cs2-banner">
          <div class="cs2-banner-eyebrow">Research · not validated vs price</div>
          <div class="cs2-banner-text">Projection-only reads (Maps 1+2 kills). Pick score is <b>PARTIAL</b> — it excludes opponent style and line value, which the data can't see yet. No edge has been proven against Underdog's number. Treat as a watchlist, not picks.</div>
        </div>`;
    }

    const matches = data.matches || [];
    if (!matches.length) {
      list.innerHTML = `<div class="lyrid-empty"><div class="lyrid-empty-title">No matches in slate</div><div class="lyrid-empty-text">Add matches with the --json generator.</div></div>`;
      return;
    }
    list.innerHTML = `<div class="lyrid-games-list">${matches.map(renderCs2MatchRow).join('')}</div>`;
    if (matches[0]) analyzeCs2Match(matches[0].matchId);
  }

  function renderCs2MatchRow(m) {
    if (m.pending) {
      const psub = `${esc(m.format || 'Bo3')}${m.tier ? ' · ' + esc(String(m.tier).toUpperCase()) : ''}${m.lan ? ' · LAN' : ''}${m.doOrDie ? ' · ELIM' : ''}`;
      return `
        <div class="lyrid-game-card cs2-pending" aria-label="${esc(m.teamA)} vs ${esc(m.teamB)} — projection pending">
          <div class="lyrid-game-time">
            <div class="lyrid-game-time-value">${esc(fmtTime(m.startTime) || 'TBD')}</div>
            <div class="lyrid-game-time-zone">${esc(m.format || 'Bo3')}</div>
          </div>
          <div class="lyrid-game-matchup">
            <div class="lyrid-game-teams"><span>${esc(m.teamA || '?')}</span><span class="at">vs</span><span>${esc(m.teamB || '?')}</span></div>
            <div class="lyrid-game-pitchers">${psub} · projection pending — run matchRead --today</div>
          </div>
          <div class="lyrid-game-projection"><div class="lyrid-game-projection-label">pending</div><div class="lyrid-game-projection-value" aria-hidden="true">·</div></div>
        </div>`;
    }
    const vol = m.roundVolume || {};
    const sub = `${esc(m.format || 'Bo3')}${m.tier ? ' · ' + esc(String(m.tier).toUpperCase()) : ''} · ${m.lan ? 'LAN' : 'ONLINE'}${m.doOrDie ? ' · ELIM' : ''}${m.stage ? ' · ' + esc(m.stage) : ''}`;
    const mapsLine = (m.maps || []).map(esc).join(' + ') || '—';
    const leanCount = (m.players || []).filter(p => p.band === 'LEAN' || p.band === 'STRONG').length;
    const isSel = String(m.matchId) === String(state.selectedMatchId);
    return `
      <button class="lyrid-game-card${isSel ? ' signal' : ''}" type="button" onclick="analyzeCs2Match('${esc(m.matchId)}')" aria-label="Read ${esc(m.teamA)} vs ${esc(m.teamB)}">
        <div class="lyrid-game-time">
          <div class="lyrid-game-time-value">${esc(fmtTime(m.startTime) || (m.date || '').slice(5) || 'TBD')}</div>
          <div class="lyrid-game-time-zone">${esc((fmtTime(m.startTime) ? (m.date || '').slice(5) + ' · ' : '') + (m.format || 'Bo3'))}</div>
        </div>
        <div class="lyrid-game-matchup">
          <div class="lyrid-game-teams"><span>${m.rankA ? '#' + m.rankA + ' ' : ''}${esc(m.teamA || '?')}</span><span class="at">vs</span><span>${m.rankB ? '#' + m.rankB + ' ' : ''}${esc(m.teamB || '?')}</span></div>
          <div class="lyrid-game-pitchers">${mapsLine} · ${sub} · E[rds] ${vol.erounds ?? '?'}${m.rosterSource === 'inferred' ? ' · inferred roster' : ''}</div>
        </div>
        <div class="lyrid-game-projection${isSel ? ' signal' : ''}">
          <div class="lyrid-game-projection-label">${leanCount} lean${leanCount === 1 ? '' : 's'}</div>
          <div class="lyrid-game-projection-value" aria-hidden="true">${isSel ? '★' : '→'}</div>
        </div>
      </button>`;
  }

  window.analyzeCs2Match = function (matchId) {
    state.selectedMatchId = matchId;
    const data = state.raw; if (!data) return;
    const m = (data.matches || []).find(x => String(x.matchId) === String(matchId));
    const container = document.getElementById('cs2AnalysisContainer');
    if (!m || !container) return;

    const list = document.getElementById('cs2GamesList');
    if (list) list.innerHTML = `<div class="lyrid-games-list">${(data.matches || []).map(renderCs2MatchRow).join('')}</div>`;

    const vol = m.roundVolume || {};
    const pctOf = (x) => x != null ? Math.round(x * 100) + '%' : '?';
    const byTeam = {};
    for (const p of (m.players || [])) { const t = p.team || '—'; (byTeam[t] = byTeam[t] || []).push(p); }
    for (const t in byTeam) byTeam[t].sort((a, b) => (b.score || 0) - (a.score || 0));

    const header = `
      <div class="cs2-analysis-head">
        <div class="cs2-analysis-title">${esc(m.teamA)} vs ${esc(m.teamB)}</div>
        <div class="cs2-analysis-sub">${esc(m.windowLabel || 'Maps 1+2')}: <b style="color:var(--text-primary)">${(m.maps || []).map(esc).join(' + ') || '—'}</b> · E[rds/map] ${vol.erounds ?? '?'} · blowout ${pctOf(vol.blowout)} · OT ${pctOf(vol.ot)}${vol.killDensity && vol.killDensity !== 1 ? ' · kill-dens ×' + vol.killDensity : ''} <span class="cs2-low">[round volume LOW CONFIDENCE]</span>${m.lineupAsOf ? ' \u00b7 lineup as of ' + esc(m.lineupAsOf) : ''}${m.rosterChanged ? ' <span class="cs2-low">\u00b7 roster changed</span>' : ''}</div>
      </div>`;

    const rr = m.roundRead;
    const roundReadHtml = !rr ? '' : `
      <div class="cs2-roundread">
        <div class="cs2-rr-top">
          <span class="cs2-rr-lean cs2-rr-${(rr.totalsLean || 'neutral').toLowerCase()}">TOTALS ${esc(rr.totalsLean)}</span>
          ${rr.blowoutRisk ? `<span class="cs2-rr-badge cs2-rr-blowout">BLOWOUT ${esc(rr.blowoutRisk)}</span>` : ''}${rr.otLean ? `<span class="cs2-rr-badge cs2-rr-ot">OT LIVE</span>` : ''}
          <span class="cs2-rr-reason">${esc(rr.reason)}</span>
        </div>
        ${rr.teamA && rr.teamB ? `<div class="cs2-rr-splits">${esc(m.teamA)} — pistol ${rr.teamA.pistol}% · CT ${rr.teamA.ct}% · T ${rr.teamA.t}% &nbsp;|&nbsp; ${esc(m.teamB)} — pistol ${rr.teamB.pistol}% · CT ${rr.teamB.ct}% · T ${rr.teamB.t}%</div>` : ''}
        ${rr.teamA && rr.teamB && rr.teamA.openingWin != null ? `<div class="cs2-rr-splits">${esc(m.teamA)} — opening ${rr.teamA.openingWin}% · trade ${rr.teamA.tradeRatio} · eco ${rr.teamA.ecoWin}% · streak ${rr.teamA.snowball} &nbsp;|&nbsp; ${esc(m.teamB)} — opening ${rr.teamB.openingWin}% · trade ${rr.teamB.tradeRatio} · eco ${rr.teamB.ecoWin}% · streak ${rr.teamB.snowball}</div>` : ''}
      </div>`;
    const teamsHtml = Object.keys(byTeam).map(t =>
      `<div class="cs2-team-eyebrow">${esc(t)}</div>${byTeam[t].map(p => renderCs2PlayerCard(p, m.matchId, m.windowLabel)).join('')}`).join('');

    container.innerHTML = header + roundReadHtml + teamsHtml +
      `<div class="cs2-foot">UNPOWERED: opponent site/pace read, positional fit, deep economy discipline, day-of stand-ins. Pick score excludes opponent-style (15%) + line-value (10%).</div>`;
  };

  function cs2RenderLineResult(p, val) {
    if (val === '' || val == null || isNaN(Number(val))) return '<span class="cs2-line-hint">enter Book line</span>';
    const line = Number(val);
    const sd = Math.max(1, (p.ceiling - p.floor) / 1.88);
    const pOver = 1 - ncdf((line - p.median) / sd);
    const over = pOver >= 0.5;
    const prob = Math.round((over ? pOver : 1 - pOver) * 100);
    const delta = p.median - line;
    const cls = over ? 'cs2-lean-over' : 'cs2-lean-under';
    return `Tool ${p.median} · Book ${esc(line)} → <span class="${cls}">${over ? 'OVER' : 'UNDER'} ${prob}%</span> <span class="cs2-line-delta">(${delta >= 0 ? '+' : ''}${delta.toFixed(1)})</span>`;
  }

  window.cs2SetLine = function (safeId, val) {
    const key = state.lineKeys[safeId]; const p = state.lineP[safeId];
    if (!key) return;
    if (val === '' || val == null) delete state.lines[key]; else state.lines[key] = val;
    try { localStorage.setItem('lyrid_cs2_lines', JSON.stringify(state.lines)); } catch (_) {}
    const el = document.getElementById('lr_' + safeId);
    if (el && p) el.innerHTML = cs2RenderLineResult(p, val);
  };

  function renderCs2PlayerCard(p, matchId, windowLabel = 'Maps 1+2') {
    const mf = p.mapFitPct == null ? 'n/a' : (p.mapFitPct >= 0 ? '+' : '') + p.mapFitPct + '%';
    const thin = p.thin ? `<span class="cs2-thin">THIN n=${p.n}</span>` : '';
    const st = (v, k) => `<span class="cs2-stat">${v}<span class="k">${k}</span></span>`;
    const flags = (p.flags || []).filter(f => !/^opponent-adjusted/.test(f)).map(f => `<div class="cs2-flag">⚠ ${esc(f)}</div>`).join('');
    const mkRow = (statKey, label, proj) => {
      if (proj.median == null) return '';
      const key = `${matchId}|${p.nick}|${statKey}`;
      const sid = 'cs2_' + key.replace(/[^A-Za-z0-9]/g, '_');
      state.lineKeys[sid] = key; state.lineP[sid] = proj;
      const cur = state.lines[key] == null ? '' : state.lines[key];
      return `
        <div class="cs2-line-row">
          <span class="cs2-line-label">${esc(label)}</span>
          <input class="cs2-line-input" type="number" step="0.5" inputmode="decimal" value="${esc(cur)}" placeholder="—" oninput="cs2SetLine('${sid}', this.value)">
          <span class="cs2-line-res" id="lr_${sid}">${cs2RenderLineResult(proj, cur)}</span>
        </div>`;
    };
    const oppAdj = (p.kprStrong == null || p.kprWeak == null) ? '' : `
        <div class="cs2-oppadj">${p.kprStrong} KPR vs elite · ${p.kprWeak} vs field</div>`;
    const hsRange = p.hsMedian == null ? '' : `
        <div class="cs2-range">
          <span class="cs2-range-eyebrow">${esc(windowLabel)} HS</span>
          <span class="cs2-range-val">${p.hsFloor}<span class="k">floor</span></span>
          <span class="cs2-range-val">${p.hsMedian}<span class="k">median</span></span>
          <span class="cs2-range-val">${p.hsCeiling}<span class="k">ceiling</span></span>
        </div>`;
    return `
      <div class="cs2-pcard">
        <div class="cs2-pcard-head">
          <span class="cs2-nick">${esc(p.nick)}</span>
          <span class="cs2-role">${esc(p.role)}</span>
          <span class="${leanClass(p.lean)}">${esc(p.lean)}</span>
          ${thin}
          <span class="cs2-score"><span class="cs2-score-num">${p.score}/100</span><span class="${bandClass(p.band)}">${esc(p.band)}</span></span>
        </div>
        <div class="cs2-statbar">
          ${st(p.kpr, 'KPR')} ${st(p.recentKpr, 'recent')} ${st(p.hs == null ? '?' : p.hs + '%', 'HS')} ${st(p.kast == null ? '?' : p.kast + '%', 'KAST')} ${st(p.fkPerMap, 'FK/map')}${p.adr == null ? '' : ' ' + st(p.adr, 'ADR')}${p.survival == null ? '' : ' ' + st(p.survival + '%', 'surv')}${p.openingWin == null ? '' : ' ' + st(p.openingWin + '%', 'open-win')}${p.clutchPerMap == null ? '' : ' ' + st(p.clutchPerMap, 'clutch')}
        </div>
        <div class="cs2-range">
          <span class="cs2-range-eyebrow">${esc(windowLabel)} kills</span>
          <span class="cs2-range-val">${p.floor}<span class="k">floor</span></span>
          <span class="cs2-range-val">${p.median}<span class="k">median</span></span>
          <span class="cs2-range-val">${p.ceiling}<span class="k">ceiling</span></span>
          <span class="cs2-mapfit">map-fit ${mf}</span>
        </div>
        ${oppAdj}
        ${hsRange}
        <div class="cs2-prop">prop: ${esc(p.propType)}</div>
        ${mkRow('kills', 'Kills line', { median: p.median, floor: p.floor, ceiling: p.ceiling })}
        ${mkRow('hs', 'HS line', { median: p.hsMedian, floor: p.hsFloor, ceiling: p.hsCeiling })}
        ${flags}
      </div>`;
  }
})();
</script>
